<body class="fade_out">

    <script>

        window.addEventListener("orientationchange", ()=>{
            setTimeout(() => {
                let vh = window.innerHeight;
                document.getElementById('finish_screen').style.height = vh + 'px';
                document.getElementById('main_wrapper').style.height = vh + 'px';
                console.log("vh");
            }, 100);
        });
    </script>
    <script>
        let btn_a = document.getElementById("btn");
        btn_a.addEventListener('click',function(){
            console.log("クリック");
        });
        // clickイベントの処理
            

        
        // btn_a.click();
        // function sensor(){
        //     console.log("クリック");
        // }

        if(window.DeviceOrientationEvent){
            if(DeviceOrientationEvent.requestPermission){
                btn_a.addEventListener("click",function(){
                    console.log("クリック");
                    DeviceOrientationEvent.requestPermission().then(function(response){
                        if(response === "granted"){
                            $(window).on("deviceorientation", gyro);
                        }
                    });
                });
            }else{
                $(window).on("deviceorientation", gyro);
            }
        }
        let bef;
        function gyro(){
            let beta = Math.floor(event.beta) ;
        
            let trans ;
            if(beta > 0){
                trans = 50 + beta;
                if(trans<90){
                    ConeObj.style.left = trans + "%";
                }
            }else if(beta < 0){
                trans = 50 + beta;
                if(trans>10){
                    ConeObj.style.left = trans + "%";
                }
            }
            
        
           
            
        }
        
    </script>
